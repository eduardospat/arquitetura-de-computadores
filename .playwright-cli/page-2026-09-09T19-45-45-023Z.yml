        - generic:
          - generic:
            - heading "Sinais de Controle (Monociclo)" [level=4]
            - table:
              - rowgroup:
                - row "Instrução RegDst ALUSrc MemtoReg RegWrite MemRead MemWrite Branch ALUOp":
                  - columnheader "Instrução"
                  - columnheader "RegDst"
                  - columnheader "ALUSrc"
                  - columnheader "MemtoReg"
                  - columnheader "RegWrite"
                  - columnheader "MemRead"
                  - columnheader "MemWrite"
                  - columnheader "Branch"
                  - columnheader "ALUOp"
              - rowgroup:
                - row "R-type 1 (rd) 0 0 (ALU) 1 0 0 0 10":
                  - cell "R-type"
                  - cell "1 (rd)"
                  - cell "0"
                  - cell "0 (ALU)"
                  - cell "1"
                  - cell "0"
                  - cell "0"
                  - cell "0"
                  - cell "10"
                - row "lw 0 (rt) 1 (ext) 1 (Mem) 1 1 0 0 00":
                  - cell "lw"
                  - cell "0 (rt)"
                  - cell "1 (ext)"
                  - cell "1 (Mem)"
                  - cell "1"
                  - cell "1"
                  - cell "0"
                  - cell "0"
                  - cell "00"
                - row "sw X 1 (ext) X 0 0 1 0 00":
                  - cell "sw"
                  - cell "X"
                  - cell "1 (ext)"
                  - cell "X"
                  - cell "0"
                  - cell "0"
                  - cell "1"
                  - cell "0"
                  - cell "00"
                - row "beq X 0 (reg) X 0 0 0 1 01":
                  - cell "beq"
                  - cell "X"
                  - cell "0 (reg)"
                  - cell "X"
                  - cell "0"
                  - cell "0"
                  - cell "0"
                  - cell "1"
                  - cell "01"
                - row "j X X X 0 0 0 0 XX":
                  - cell "j"
                  - cell "X"
                  - cell "X"
                  - cell "X"
                  - cell "0"
                  - cell "0"
                  - cell "0"
                  - cell "0"
                  - cell "XX"
            - heading "Os 5 Passos do Multiciclo" [level=4]
            - list:
              - listitem:
                - text: "1. Busca (Fetch):"
                - code: IR = Mem[PC]; PC = PC + 4;
              - listitem:
                - text: "2. Decodificação:"
                - code: A = Reg[rs]; B = Reg[rt]; ALUOut = PC + (ext << 2);
              - listitem:
                - text: "3. Execução:"
                - list:
                  - listitem:
                    - text: "R-type:"
                    - code: ALUOut = A op B;
                  - listitem:
                    - text: "LW/SW:"
                    - code: ALUOut = A + ext;
                  - listitem:
                    - text: "BEQ:"
                    - code: if (A == B) PC = ALUOut;
                    - text: (termina)
                  - listitem:
                    - text: "Jump:"
                    - code: PC = PC[31:28] & (IR[25:0]<<2);
                    - text: (termina)
              - listitem:
                - text: "4. Memória / Write-Back R:"
                - list:
                  - listitem:
                    - text: "R-type:"
                    - code: Reg[rd] = ALUOut;
                    - text: (termina)
                  - listitem:
                    - text: "SW:"
                    - code: Mem[ALUOut] = B;
                    - text: (termina)
                  - listitem:
                    - text: "LW:"
                    - code: MDR = Mem[ALUOut];
              - listitem:
                - text: "5. Write-Back LW:"
                - code: Reg[rt] = MDR;
                - text: (termina)
